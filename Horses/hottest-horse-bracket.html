<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Hottest Horse Invitational</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700;9..144,900&family=Space+Grotesk:wght@400;500;600;700&display=swap');

:root{
  --cream:#FBF3E6;
  --cream-deep:#F3E7D3;
  --ink:#271507;
  --ink-soft:#5B4636;
  --green:#1F4B3D;
  --green-deep:#153229;
  --pink:#E8547C;
  --pink-pale:#F8D9DF;
  --gold:#C79A2B;
  --gold-pale:#F2E2B4;
  --line:#D9C6A3;
  --radius:18px;
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--cream);
  color:var(--ink);
  font-family:'Space Grotesk',sans-serif;
  min-height:100%;
  -webkit-font-smoothing:antialiased;
}

.app{
  max-width:900px;
  margin:0 auto;
  padding:28px 18px 60px;
}

/* ---------- MASTHEAD ---------- */
.masthead{
  text-align:center;
  margin-bottom:22px;
  position:relative;
}
.masthead .eyebrow{
  font-size:12px;
  letter-spacing:.22em;
  text-transform:uppercase;
  color:var(--pink);
  font-weight:700;
  margin-bottom:6px;
}
.masthead h1{
  font-family:'Fraunces',serif;
  font-weight:900;
  font-optical-sizing:auto;
  font-size:clamp(30px,7vw,52px);
  line-height:1.02;
  margin:0;
  color:var(--green-deep);
  letter-spacing:-0.01em;
}
.masthead h1 span{color:var(--pink);}
.masthead .rule{
  display:flex;
  align-items:center;
  gap:10px;
  justify-content:center;
  margin-top:12px;
  color:var(--gold);
}
.masthead .rule::before,.masthead .rule::after{
  content:"";
  height:2px;
  width:60px;
  background:var(--gold);
  opacity:.55;
}
.masthead .tagline{
  font-size:13px;
  color:var(--ink-soft);
  margin-top:8px;
  font-style:italic;
}

/* ---------- TABS ---------- */
.tabs{
  display:flex;
  gap:6px;
  overflow-x:auto;
  padding:4px 2px 14px;
  margin-bottom:6px;
  scrollbar-width:none;
}
.tabs::-webkit-scrollbar{display:none;}
.tab{
  flex:0 0 auto;
  padding:9px 14px;
  border-radius:999px;
  border:1.5px solid var(--line);
  background:#fff;
  font-family:'Space Grotesk',sans-serif;
  font-weight:600;
  font-size:12.5px;
  color:var(--ink-soft);
  cursor:pointer;
  white-space:nowrap;
  transition:all .15s ease;
  display:flex;align-items:center;gap:6px;
}
.tab.done{color:var(--green);border-color:var(--green);}
.tab.active{
  background:var(--green-deep);
  border-color:var(--green-deep);
  color:#fff;
}
.tab.locked{
  opacity:.4;
  cursor:not-allowed;
}
.tab .check{color:var(--gold);font-size:12px;}
.tab.active .check{color:var(--gold-pale);}

/* ---------- ROUND HEADER ---------- */
.round-header{
  text-align:center;
  margin:18px 0 24px;
}
.round-header .rname{
  font-family:'Fraunces',serif;
  font-weight:800;
  font-size:clamp(22px,5vw,32px);
  color:var(--green-deep);
  margin:0;
}
.round-header .rsub{
  font-size:13px;
  color:var(--pink);
  font-weight:600;
  letter-spacing:.04em;
  text-transform:uppercase;
  margin-top:4px;
}
.round-header .rhint{
  font-size:12.5px;
  color:var(--ink-soft);
  margin-top:6px;
}

/* ---------- MATCHUPS ---------- */
.matches{
  display:flex;
  flex-direction:column;
  gap:22px;
}
.match{
  background:#fff;
  border:1.5px solid var(--line);
  border-radius:var(--radius);
  padding:16px;
  position:relative;
}
.match .matchlabel{
  position:absolute;
  top:-10px;
  left:16px;
  background:var(--gold);
  color:#fff;
  font-size:10.5px;
  font-weight:700;
  letter-spacing:.06em;
  padding:3px 9px;
  border-radius:999px;
  text-transform:uppercase;
}
.pair{
  display:grid;
  grid-template-columns:1fr auto 1fr;
  align-items:center;
  gap:10px;
}
.vs{
  font-family:'Fraunces',serif;
  font-weight:700;
  font-style:italic;
  color:var(--gold);
  font-size:15px;
}

.horse{
  border-radius:14px;
  border:2px solid transparent;
  padding:10px;
  cursor:pointer;
  text-align:center;
  position:relative;
  transition:transform .12s ease, border-color .12s ease, background .12s ease, opacity .12s ease;
  background:var(--cream-deep);
}
.horse:hover{transform:translateY(-2px);}
.horse:active{transform:translateY(0);}
.horse .photo-wrap{
  width:100%;
  aspect-ratio:1/1;
  border-radius:10px;
  overflow:hidden;
  background:var(--cream);
  margin-bottom:8px;
  position:relative;
}
.horse img{
  width:100%;height:100%;object-fit:cover;display:block;
}
.horse .name{
  font-family:'Fraunces',serif;
  font-weight:700;
  font-size:15px;
  color:var(--ink);
  line-height:1.15;
}
.horse .sub{
  font-size:11px;
  color:var(--ink-soft);
  margin-top:2px;
}
.horse.winner{
  border-color:var(--gold);
  background:var(--gold-pale);
}
.horse.loser{
  opacity:.4;
}
.horse.loser .photo-wrap{filter:grayscale(70%);}
.horse.tbd{
  cursor:default;
  opacity:.55;
}
.horse.tbd .photo-wrap{
  display:flex;align-items:center;justify-content:center;
  background:repeating-linear-gradient(135deg,var(--cream) 0 10px,var(--cream-deep) 10px 20px);
}
.horse.tbd .name{color:var(--ink-soft);font-style:italic;font-weight:500;}

.ribbon{
  position:absolute;
  top:-14px;
  right:-10px;
  width:40px;
  height:40px;
  z-index:2;
  animation:pop .35s cubic-bezier(.3,1.6,.4,1);
}
@keyframes pop{
  0%{transform:scale(0) rotate(-20deg);}
  70%{transform:scale(1.15) rotate(8deg);}
  100%{transform:scale(1) rotate(0deg);}
}

.eliminated-stamp{
  position:absolute;
  top:40%;
  left:50%;
  transform:translate(-50%,-50%) rotate(-12deg);
  border:2px solid var(--pink);
  color:var(--pink);
  font-family:'Space Grotesk',sans-serif;
  font-weight:700;
  font-size:10px;
  letter-spacing:.08em;
  text-transform:uppercase;
  padding:3px 8px;
  border-radius:6px;
  background:rgba(255,255,255,.85);
  z-index:2;
}

/* ---------- NAV ---------- */
.roundnav{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-top:26px;
}
.navbtn{
  border:1.5px solid var(--green-deep);
  background:#fff;
  color:var(--green-deep);
  font-family:'Space Grotesk',sans-serif;
  font-weight:700;
  font-size:13px;
  padding:10px 16px;
  border-radius:999px;
  cursor:pointer;
  transition:background .15s ease,color .15s ease;
}
.navbtn:hover:not(:disabled){background:var(--green-deep);color:#fff;}
.navbtn:disabled{opacity:.35;cursor:not-allowed;}

/* ---------- FOOTER ACTIONS ---------- */
.footer-actions{
  text-align:center;
  margin-top:34px;
}
.reset-link{
  font-size:12px;
  color:var(--ink-soft);
  text-decoration:underline;
  cursor:pointer;
  background:none;border:none;
  font-family:'Space Grotesk',sans-serif;
}

/* ---------- CHAMPION ---------- */
.champion-screen{
  text-align:center;
  padding:20px 10px 10px;
  position:relative;
}
.champion-screen .eyebrow2{
  font-family:'Fraunces',serif;
  font-style:italic;
  font-weight:700;
  color:var(--pink);
  font-size:16px;
  margin-bottom:6px;
}
.champion-screen h2{
  font-family:'Fraunces',serif;
  font-weight:900;
  font-size:clamp(28px,8vw,46px);
  color:var(--green-deep);
  margin:0 0 18px;
}
.champ-frame{
  width:min(320px,72vw);
  aspect-ratio:1/1;
  margin:0 auto;
  border-radius:50%;
  border:6px solid var(--gold);
  overflow:hidden;
  box-shadow:0 10px 30px rgba(31,75,61,.25);
  position:relative;
}
.champ-frame img{width:100%;height:100%;object-fit:cover;display:block;}
.champ-name{
  font-family:'Fraunces',serif;
  font-weight:800;
  font-size:26px;
  color:var(--ink);
  margin-top:20px;
}
.champ-sub{
  font-size:13px;
  color:var(--ink-soft);
  margin-top:2px;
}
.champ-rosette{
  position:absolute;
  bottom:-8px;
  right:calc(50% - 130px);
  width:70px;height:70px;
  animation:pop .5s cubic-bezier(.3,1.6,.4,1);
}

/* ---------- BRACKET RECAP ---------- */
.recap{
  margin-top:30px;
  border-top:1.5px dashed var(--line);
  padding-top:18px;
}
.recap summary{
  cursor:pointer;
  font-family:'Fraunces',serif;
  font-weight:700;
  font-size:15px;
  color:var(--green-deep);
  text-align:center;
  list-style:none;
}
.recap summary::-webkit-details-marker{display:none;}
.recap summary::after{content:" ▾";}
.recap[open] summary::after{content:" ▴";}
.recap-round{margin-top:14px;}
.recap-round h4{
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:.08em;
  color:var(--pink);
  margin:0 0 8px;
  text-align:center;
}
.recap-chips{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  justify-content:center;
}
.recap-chip{
  font-size:11.5px;
  background:var(--cream-deep);
  border:1px solid var(--line);
  border-radius:999px;
  padding:5px 10px;
  color:var(--ink-soft);
}
.recap-chip.win{
  background:var(--gold-pale);
  border-color:var(--gold);
  color:var(--ink);
  font-weight:600;
}

/* ---------- CONFETTI ---------- */
.confetti-piece{
  position:fixed;
  top:-20px;
  width:9px;height:14px;
  z-index:999;
  pointer-events:none;
  animation:fall linear forwards;
}
@keyframes fall{
  to{transform:translateY(105vh) rotate(540deg);opacity:.9;}
}

@media (max-width:520px){
  .pair{grid-template-columns:1fr;gap:0;}
  .vs{
    margin:6px auto;
    display:block;
  }
  .horse .name{font-size:14px;}
}
</style>
</head>

    <div class="tagline">16 leading stallions enter. One winner's circle awaits.</div>
  </div>

  <div class="tabs" id="tabs"></div>

</div>

const SEED = [
  ["maximus","samson"],
  ["khan","phillipe"],
  ["pegasus","artax"],
  ["shadowfax","spirit"],
  ["bullseye","froufrou"],
  ["altivo","angus"],
  ["bojack","pokey"],
  ["blackbeauty","achilles"],
];

const ROUND_META = [
  { name:"Round of 16", sub:"The Open Field",     hint:"Tap a horse to send them through." },
  { name:"Elite 8",     sub:"Fan Favorites",       hint:"The field narrows. Choose wisely." },
  { name:"Final 4",     sub:"Barn Burners",        hint:"Two spots left in the winner's circle." },
  { name:"The Final",   sub:"Winner's Circle",     hint:"Crown the Hottest Horse." },
];

// ---- state ----
let rounds = [];
let champion = null;
let viewIdx = 0;

function initBracket(){
  rounds = [];
  rounds.push(SEED.map(([a,b]) => ({a,b,winner:null})));
  let len = SEED.length/2;
  while(len >= 1){
    rounds.push(Array.from({length:len}, () => ({a:null,b:null,winner:null})));
    len = len/2;
  }
  champion = null;
  viewIdx = 0;
}

function resetFrom(r, m){
  rounds[r][m].winner = null;
  if(r+1 < rounds.length){
    const nm = Math.floor(m/2);
    const slot = (m%2===0) ? 'a' : 'b';
    const next = rounds[r+1][nm];
    next[slot] = null;
    if(next.winner) resetFrom(r+1, nm);
  } else {
    champion = null;
  }
}

function pickWinner(r, m, key){
  const match = rounds[r][m];
  if(!match.a || !match.b) return;
  if(match.winner === key) return;
  match.winner = key;
  if(r+1 < rounds.length){
    const nm = Math.floor(m/2);
    const slot = (m%2===0) ? 'a' : 'b';
    const next = rounds[r+1][nm];
    if(next[slot] !== key){
      next[slot] = key;
      if(next.winner && next.winner !== next.a && next.winner !== next.b){
        resetFrom(r+1, nm);
      }
    }
  } else {
    champion = key;
  }
  advanceViewIfComplete(r);
  render();
}

function advanceViewIfComplete(r){
  const roundComplete = rounds[r].every(mt => mt.winner);
  if(roundComplete && r === viewIdx && r+1 < rounds.length){
    viewIdx = r+1;
  } else if(roundComplete && r === viewIdx && r+1 === rounds.length){
    viewIdx = rounds.length; // champion screen
  }
}

function roundUnlocked(r){
  if(r === 0) return true;
  return rounds[r-1].every(mt => mt.winner);
}

function horseCardHTML(key, cls, extra){
  if(!key){
    return `<div class="horse tbd">
      <div class="photo-wrap">?</div>
      <div class="name">TBD</div>
      <div class="sub">Winner pending</div>
    </div>`;
  }
  const h = HORSES[key];
  return `<div class="horse ${cls}" data-key="${key}">
    <div class="photo-wrap"><img src="${IMG[key]}" alt="${h.name}"></div>
    <div class="name">${h.name}</div>
    <div class="sub">${h.sub}</div>
    ${extra||""}
  </div>`;
}

const RIBBON_SVG = `<svg class="ribbon" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <circle cx="32" cy="24" r="18" fill="#C79A2B" stroke="#fff" stroke-width="2"/>
  <path d="M20 38 L14 60 L32 50 L50 60 L44 38 Z" fill="#E8547C"/>
  <circle cx="32" cy="24" r="10" fill="#F2E2B4"/>
</svg>`;

const STAMP_HTML = `<div class="eliminated-stamp">Neigh</div>`;

function renderTabs(){
  const tabs = document.getElementById('tabs');
  let html = "";
  ROUND_META.forEach((meta, i) => {
    const unlocked = roundUnlocked(i);
    const complete = rounds[i].every(mt => mt.winner);
    let cls = "tab";
    if(!unlocked) cls += " locked";
    if(complete) cls += " done";
    if(viewIdx === i) cls += " active";
    html += `<button class="${cls}" ${unlocked ? `onclick="goTo(${i})"` : "disabled"}>
      ${complete ? '<span class="check">✓</span>' : ''}${meta.name}
    </button>`;
  });
  const champReady = champion !== null;
  let champCls = "tab";
  if(champReady) champCls += " done";
  if(viewIdx === rounds.length) champCls += " active";
  html += `<button class="${champCls}" ${champReady ? `onclick="goTo(${rounds.length})"` : "disabled"}>🏆 Champion</button>`;
  tabs.innerHTML = html;
}

function goTo(i){
  viewIdx = i;
  render();
}

function renderRound(r){
  const meta = ROUND_META[r];
  let html = `<div class="round-header">
    <p class="rname">${meta.name}</p>
    <p class="rsub">${meta.sub}</p>
    <p class="rhint">${meta.hint}</p>
  </div>
  <div class="matches">`;

  rounds[r].forEach((mt, i) => {
    const aWon = mt.winner && mt.winner === mt.a;
    const bWon = mt.winner && mt.winner === mt.b;
    const aCls = mt.winner ? (aWon ? "winner" : "loser") : "";
    const bCls = mt.winner ? (bWon ? "winner" : "loser") : "";
    const aClick = (mt.a && mt.b) ? `onclick="pickWinner(${r},${i},'${mt.a}')"` : "";
    const bClick = (mt.a && mt.b) ? `onclick="pickWinner(${r},${i},'${mt.b}')"` : "";

    let aHTML = horseCardHTML(mt.a, aCls, aWon ? RIBBON_SVG : (mt.winner ? STAMP_HTML : ""));
    let bHTML = horseCardHTML(mt.b, bCls, bWon ? RIBBON_SVG : (mt.winner ? STAMP_HTML : ""));
    aHTML = aHTML.replace('<div class="horse', `<div ${aClick} class="horse`);
    bHTML = bHTML.replace('<div class="horse', `<div ${bClick} class="horse`);

    html += `<div class="match">
      <div class="matchlabel">Match ${i+1}</div>
      <div class="pair">
        ${aHTML}
        <div class="vs">vs</div>
        ${bHTML}
      </div>
    </div>`;
  });

  html += `</div>
  <div class="roundnav">
    <button class="navbtn" onclick="goTo(${r-1})" ${r===0 ? "disabled" : ""}>← Back</button>
    <button class="navbtn" onclick="goTo(${r+1})" ${(r+1<=rounds.length && roundUnlocked(Math.min(r+1,rounds.length-1)) && rounds[r].every(m=>m.winner)) ? "" : "disabled"}>Next →</button>
  </div>`;

  return html;
}

function renderChampion(){
  const h = HORSES[champion];
  launchConfetti();
  return `<div class="champion-screen">
    <p class="eyebrow2">She said it herself —</p>
    <h2>🏆 Hottest Horse 🏆</h2>
    <div class="champ-frame">
      <img src="${IMG[champion]}" alt="${h.name}">
    </div>
    <div class="champ-name">${h.name}</div>
    <div class="champ-sub">${h.sub}</div>
    <div class="roundnav" style="justify-content:center;">
      <button class="navbtn" onclick="goTo(${rounds.length-1})">← Back to Final</button>
    </div>
  </div>`;
}

function renderRecap(){
  let html = `<details class="recap"><summary>See full bracket so far</summary>`;
  rounds.forEach((rd, ri) => {
    if(ri >= ROUND_META.length) return;
    const anyPlayed = rd.some(mt => mt.a || mt.b);
    if(!anyPlayed) return;
    html += `<div class="recap-round"><h4>${ROUND_META[ri].name}</h4><div class="recap-chips">`;
    rd.forEach(mt => {
      [mt.a, mt.b].forEach(k => {
        if(!k) return;
        const isWinner = mt.winner === k;
        const cls = isWinner ? "recap-chip win" : "recap-chip";
        html += `<span class="${cls}">${HORSES[k].name}${isWinner ? " ✓" : ""}</span>`;
      });
    });
    html += `</div></div>`;
  });
  if(champion){
    html += `<div class="recap-round"><h4>Champion</h4><div class="recap-chips">
      <span class="recap-chip win">🏆 ${HORSES[champion].name}</span>
    </div></div>`;
  }
  html += `</details>`;
  return html;
}

function render(){
  renderTabs();
  const content = document.getElementById('content');
  if(viewIdx >= rounds.length){
    content.innerHTML = renderChampion() + `
      <div class="footer-actions">
        <button class="reset-link" onclick="doReset()">Reset entire bracket</button>
      </div>`;
  } else {
    content.innerHTML = renderRound(viewIdx) + renderRecap() + `
      <div class="footer-actions">
        <button class="reset-link" onclick="doReset()">Reset entire bracket</button>
      </div>`;
  }
}

function doReset(){
  if(confirm("Reset the whole bracket? All picks will be cleared.")){
    initBracket();
    render();
  }
}

function launchConfetti(){
  const colors = ["#E8547C","#C79A2B","#1F4B3D","#F2E2B4","#fff"];
  for(let i=0;i<70;i++){
    const p = document.createElement('div');
    p.className = 'confetti-piece';
    p.style.left = Math.random()*100 + 'vw';
    p.style.background = colors[Math.floor(Math.random()*colors.length)];
    p.style.animationDuration = (2.2 + Math.random()*1.6) + 's';
    p.style.animationDelay = (Math.random()*0.6) + 's';
    p.style.transform = `rotate(${Math.random()*360}deg)`;
    document.body.appendChild(p);
    setTimeout(() => p.remove(), 4200);
  }
}

initBracket();
render();
</script>
</body>
</html>
